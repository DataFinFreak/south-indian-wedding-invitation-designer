/* ===== Cover / envelope ===== */

.env { position: relative; width: min(340px, 86vw); aspect-ratio: 1.42; perspective: 1400px; filter: drop-shadow(0 26px 34px rgba(40,10,8,.38)); transition: transform 1.4s var(--ease-out) .9s; }

.env .letter .nm { font-family: var(--f-names); font-style: var(--names-style); font-weight: var(--names-weight); font-size: clamp(1.5rem, 7vw, 2rem); color: var(--names); line-height: 1.1; margin: 4px 0; overflow-wrap: anywhere; }
.env .letter .cap { font-size: .62rem; letter-spacing: .22em; }

.env .front { z-index: 3; }
.env .flap { z-index: 4; transform-origin: 50% 0; transition: transform .9s cubic-bezier(.6,0,.3,1) .15s, z-index 0s .6s; }
body.opening .env .flap { transform: rotateX(180deg); z-index: 1; }
.e-back { fill: var(--env-back); } .e-front { fill: var(--env-front); } .e-flap { fill: var(--env-flap); }

.seal svg { width: 100%; height: 100%; display: block; filter: drop-shadow(0 6px 8px rgba(60,10,10,.4)); }

/* ===== Music ===== */
#musicBtn { position: fixed; z-index: 35; top: calc(14px + env(safe-area-inset-top, 0px)); right: max(14px, env(safe-area-inset-right, 0px)); width: 46px; height: 46px; border-radius: 50%; border: 1px solid var(--line); background: var(--paper); color: var(--accent); cursor: pointer; display: grid; place-items: center; box-shadow: 0 6px 18px -8px rgba(60,20,20,.4); transition: opacity .6s; }

#musicBtn.on .bars i:nth-child(2) { animation-delay: .25s; } #musicBtn.on .bars i:nth-child(3) { animation-delay: .5s; } #musicBtn.on .bars i:nth-child(4) { animation-delay: .75s; }
#musicBtn:not(.on) .bars, #musicBtn.on .note { display: none; }
@keyframes eq { 0%, 100% { transform: scaleY(.3); } 50% { transform: scaleY(1); } }

/* ===== Page ===== */
.band { height: 22px; background: var(--band); }

.hero::before { content: ""; position: absolute; left: 50%; top: 30px; width: 640px; height: 640px; margin-left: -320px; border-radius: 50%; background: radial-gradient(closest-side, var(--halo), transparent); opacity: .8; pointer-events: none; }
.motif { display: block; width: min(330px, 86vw); height: auto; margin: 0 auto; position: relative; overflow: visible; }

.names { margin-top: 8px; font-family: var(--f-names); font-style: var(--names-style); font-weight: var(--names-weight); color: var(--names); font-size: min(var(--names-max), calc((100vw - 56px) / (var(--nlen, 6) * var(--name-cw)))); line-height: 1.02; display: flex; flex-direction: column; align-items: center; position: relative; overflow-wrap: anywhere; }

.date-strip { margin: 32px auto 0; display: inline-grid; grid-template-columns: auto auto auto; align-items: center; gap: 16px; font-family: var(--f-cap); color: var(--accent-dk); position: relative; }

.date-strip .mid small { font-size: .84rem; letter-spacing: .22em; margin-top: 8px; text-transform: uppercase; }
.date-strip.long .mid b { font-size: 1.5rem; line-height: 1.2; }
.date-strip.raw { grid-template-columns: auto; }
.date-strip.raw .mid b { font-size: 1.4rem; }
.family { white-space: pre-line; margin: 26px auto 0; max-width: 32ch; font-size: 1.05rem; color: var(--soft); position: relative; }
.place { margin-top: 16px; position: relative; }

.section { padding: 70px 0; position: relative; }
.orn { display: block; width: 180px; height: 30px; margin: 0 auto 12px; }
.title { font-family: var(--f-title); font-weight: var(--title-weight, 400); font-size: var(--title-size); color: var(--accent); line-height: 1.1; margin-top: 6px; }

/* couple photo (optional) */
.couple { position: relative; isolation: isolate; overflow: hidden; padding: 56px 0 8px; text-align: center; }
.couple .stage { position: relative; width: min(320px, 80vw); margin: 0 auto; }

.couple img { position: relative; display: block; width: 100%; height: auto; -webkit-mask-image: linear-gradient(to bottom, #000 62%, transparent 97%), linear-gradient(to right, transparent 0, #000 7%, #000 93%, transparent 100%); -webkit-mask-composite: source-in; mask-image: linear-gradient(to bottom, #000 62%, transparent 97%), linear-gradient(to right, transparent 0, #000 7%, #000 93%, transparent 100%); mask-composite: intersect; }

/* save the date + optional backdrop */
.std { overflow: hidden; isolation: isolate; }
.std .bd { position: absolute; inset: -40px 0; z-index: -1; background: var(--img) 50% 50% / cover; filter: blur(2.5px) brightness(1.06) saturate(1.05); transform: scale(1.05); -webkit-mask-image: linear-gradient(transparent, #000 12%, #000 88%, transparent); mask-image: linear-gradient(transparent, #000 12%, #000 88%, transparent); }

.cals { display: grid; gap: 22px; justify-content: center; grid-template-columns: repeat(auto-fit, minmax(0, 340px)); margin-top: 32px; }

.events { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 270px), 1fr)); gap: 26px; margin-top: 36px; }

/* venue */
.venue { color: var(--on-field); background: var(--grain), radial-gradient(120% 90% at 50% 0%, var(--field-hi), var(--field-mid) 40%, var(--field-lo)); padding: 76px 0; }

.motif.sm { width: 200px; margin-top: 34px; }

.foot:empty { display: none; }

/* dev banner (?check) and config error */
#devBanner { position: fixed; z-index: 60; left: 8px; right: 8px; bottom: 8px; padding: 10px 14px; background: #FFF4C2; color: #3A2A00; border: 1px solid #C9A227; border-radius: 8px; font: 14px/1.45 system-ui, sans-serif; box-shadow: 0 8px 24px -10px rgba(0,0,0,.4); max-height: 40vh; overflow: auto; }
#devBanner b { font-weight: 700; }

@media (min-width: 700px) { .events { grid-template-columns: repeat(auto-fit, minmax(270px, 1fr)); } }

  .js .rv { opacity: 1; transform: none; transition: none; }
  #opening, .env, .env .letter, .env .flap, .seal, .op-top, .op-hint { transition-duration: .01s !important; transition-delay: 0s !important; }
}
